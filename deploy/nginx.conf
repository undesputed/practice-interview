# Reverse proxy with TLS — HTTPS is required for browser camera + mic access.
server {
    listen 443 ssl;
    server_name molave.ai.persolhr.com;

    ssl_certificate     /etc/ssl/interview/cert.pem;
    ssl_certificate_key /etc/ssl/interview/key.pem;

    # Interview scoring POSTs can include many MediaPipe frames + transcript.
    # Default nginx limit is 1m, which rejects longer sessions with 413.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
}
server {
    listen 80;
    server_name molave.ai.persolhr.com;
    return 301 https://$host$request_uri;
}
